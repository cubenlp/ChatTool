name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag matches package version
        run: |
          tag_name="${GITHUB_REF_NAME#v}"
          package_version="$(python3 - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("src/chattool/__init__.py").read_text(encoding="utf-8"))
          for stmt in module.body:
              if not isinstance(stmt, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "__version__" for target in stmt.targets):
                  print(ast.literal_eval(stmt.value))
                  break
          else:
              raise SystemExit("__version__ not found in src/chattool/__init__.py")
          PY
          )"

          if [[ "$tag_name" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Verify release commit is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tag commit $GITHUB_SHA is not contained in origin/master."
            exit 1
          fi
      - name: Fail if version already exists on PyPI
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          package = "chattool"
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{package}/{version}/json"

          try:
              urllib.request.urlopen(url)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"{package} {version} is not yet on PyPI; continuing.")
                  sys.exit(0)
              raise
          else:
              print(
                  f"{package} {version} is already on PyPI. "
                  "Bump src/chattool/__init__.py and merge that change before pushing a release tag."
              )
              sys.exit(1)
          PY
      - name: Set up Python "3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Run stable smoke tests
        run: |
          python -m pytest -q \
            tests/code-tests/skills \
            tests/mock-cli-tests
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
